[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairon-mcp-server"
version = "1.0.0"
description = "A generic MCP server over Kairon DFIR's read-only case tools"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
kairon-mcp-server = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
