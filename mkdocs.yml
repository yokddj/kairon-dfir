site_name: Kairon DFIR
site_description: Self-hosted DFIR platform — evidence ingestion, parsing, search, timeline, detections and memory analysis.
site_url: https://yokddj.github.io/kairon-dfir/
repo_url: https://github.com/yokddj/kairon-dfir
repo_name: yokddj/kairon-dfir
edit_uri: edit/main/docs/
copyright: Kairon DFIR — AGPL-3.0

# docs/SECURITY.md only redirects old links to the root SECURITY.md on GitHub.
exclude_docs: |
  SECURITY.md
  .DS_Store
  requirements.txt

# A page added to docs/ but forgotten in the nav below fails the strict build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/brand/kairon-dfir-mark-transparent.svg
  favicon: assets/brand/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/stylesheets/kairon.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

