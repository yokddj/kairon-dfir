name: Dependency watch

# docker/memory-worker/Dockerfile resolves the current MemProcFS build
# automatically at image build time from the GitHub Releases API
# (fetch_memprocfs.py), so a normal build no longer depends on a human
# noticing and repinning when upstream republishes binaries under the same
# release tag. The MEMPROCFS_VERSION/BUILD/SHA256_* ARGs in that Dockerfile
# are only a fallback used if the GitHub API is unreachable at build time
# (offline build, rate limiting, API outage).
#
# This workflow keeps that fallback from going stale, without needing anyone
# to watch for it: on a weekly schedule, it asks the GitHub API (via
# fetch_memprocfs.py --resolve-only) for the current build and, if it differs
# from the fallback pin, opens a PR that updates it and verifies the new
# values with a real `docker build` forcing the fallback path. Review and
# merge at your convenience -- it is not urgent, since the fallback pin going
# stale does not break a normal (online) build.

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 08:00 UTC
  workflow_dispatch: {}

jobs:
  update-memprocfs-fallback-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current MemProcFS build from the GitHub API
        id: resolve
        env:
          DOCKERFILE: docker/memory-worker/Dockerfile
        run: |
          set -euo pipefail
          get_arg() { sed -n "s/^ARG ${1}=\(.*\)\$/\1/p" "$DOCKERFILE" | head -1; }
          TAG=$(get_arg MEMPROCFS_TAG)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "cur_version=$(get_arg MEMPROCFS_VERSION)" >> "$GITHUB_OUTPUT"
          echo "cur_build=$(get_arg MEMPROCFS_BUILD)" >> "$GITHUB_OUTPUT"

          python3 docker/memory-worker/fetch_memprocfs.py --tag "$TAG" --resolve-only > /tmp/resolved.json
          python3 -c "
          import json
          d = json.load(open('/tmp/resolved.json'))
          print('version=' + d['amd64']['version'])
          print('build=' + d['amd64']['build'])
          print('sha256_amd64=' + d['amd64']['sha256'])
          print('sha256_arm64=' + d['arm64']['sha256'])
          " >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile and notices if the fallback pin is stale
        id: update
        env:
          DOCKERFILE: docker/memory-worker/Dockerfile
          NOTICE: docker/memory-worker/THIRD_PARTY_NOTICES.md
          VERSION: ${{ steps.resolve.outputs.version }}
          BUILD: ${{ steps.resolve.outputs.build }}
          SHA_AMD64: ${{ steps.resolve.outputs.sha256_amd64 }}
          SHA_ARM64: ${{ steps.resolve.outputs.sha256_arm64 }}
          CUR_VERSION: ${{ steps.resolve.outputs.cur_version }}
          CUR_BUILD: ${{ steps.resolve.outputs.cur_build }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "$CUR_VERSION" ] && [ "$BUILD" = "$CUR_BUILD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fallback pin already matches the current upstream build ($VERSION/$BUILD); nothing to do."
            exit 0
          fi

          sed -i \
            -e "s/^ARG MEMPROCFS_VERSION=.*/ARG MEMPROCFS_VERSION=${VERSION}/" \
            -e "s/^ARG MEMPROCFS_BUILD=.*/ARG MEMPROCFS_BUILD=${BUILD}/" \
            -e "s/^ARG MEMPROCFS_SHA256_AMD64=.*/ARG MEMPROCFS_SHA256_AMD64=${SHA_AMD64}/" \
            -e "s/^ARG MEMPROCFS_SHA256_ARM64=.*/ARG MEMPROCFS_SHA256_ARM64=${SHA_ARM64}/" \
            "$DOCKERFILE"

          python3 docker/memory-worker/update_notice_pin.py "$NOTICE" "$VERSION" "$BUILD" "$SHA_AMD64" "$SHA_ARM64"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.update.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Verify the new fallback pin with a real build
        if: steps.update.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/memory-worker/Dockerfile
          push: false
          # Force the fallback path (skip the GitHub API lookup) to prove
          # the new fallback pin works entirely on its own.
          build-args: |
            MEMPROCFS_FORCE_FALLBACK=1

      - name: Open PR with the refreshed fallback pin
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            Refresh MemProcFS fallback pin to ${{ steps.resolve.outputs.version }}/${{ steps.resolve.outputs.build }}

            Automated update by the dependency-watch workflow: upstream
            published a new MemProcFS build under the v5.19 tag. This only
            affects the offline fallback path in
            docker/memory-worker/Dockerfile (fetch_memprocfs.py); normal
            online builds already resolved this automatically. Verified with
            a real docker build forcing the fallback path.
          title: "Refresh MemProcFS fallback pin to ${{ steps.resolve.outputs.version }}/${{ steps.resolve.outputs.build }}"
          body: |
            Automated by `.github/workflows/dependency-watch.yml`.

            Upstream (`ufrisk/MemProcFS`) published a new build under the
            pinned `v5.19` release tag. Normal (online) builds of
            `memory-worker` already pick this up automatically via
            `fetch_memprocfs.py`; this PR only refreshes the **fallback**
            pin used when the GitHub API is unreachable at build time.

            - Version: `${{ steps.resolve.outputs.cur_version }}` -> `${{ steps.resolve.outputs.version }}`
            - Build: `${{ steps.resolve.outputs.cur_build }}` -> `${{ steps.resolve.outputs.build }}`
            - SHA-256 (amd64): `${{ steps.resolve.outputs.sha256_amd64 }}`
            - SHA-256 (arm64): `${{ steps.resolve.outputs.sha256_arm64 }}`

            CI for this PR built `memory-worker` with the GitHub API lookup
            forced off (`MEMPROCFS_FORCE_FALLBACK=1`), to confirm the new
            fallback pin works on its own. Safe to merge once checks pass;
            not urgent.
          branch: automated/memprocfs-fallback-pin
          labels: dependency-watch
          delete-branch: true
