name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  repo-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -e
          test -f README.md || { echo "MISSING README.md"; exit 1; }
          test -f docker-compose.yml || { echo "MISSING docker-compose.yml"; exit 1; }
          test -f scripts/setup.sh || { echo "MISSING scripts/setup.sh"; exit 1; }
          test -f .env.example || { echo "MISSING .env.example"; exit 1; }
          echo "All required files present"
      - name: Check no em-dash in flags
        run: |
          if grep -rPn '\xe2\x80\x93' --include='*.sh' --include='*.md' scripts/ README.md docs/ 2>/dev/null | grep -q .; then
            echo "ERROR: em-dash found in flags. Use ASCII double-dash (--) instead."
            exit 1
          fi
          echo "OK: no em-dash in flags"

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      KAIRON_AUTH_ENABLED: "false"
      BACKEND_DATA_DIR: ${{ runner.temp }}/kairon-ci-data
      BACKEND_TEMP_DIR: ${{ runner.temp }}/kairon-ci-data/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        # Known pre-existing failures are marked xfail via
        # tests/conftest.py + tests/known_failures.txt, so this job now
        # genuinely fails on any regression instead of being advisory.
        run: python -m pytest tests/ -q --ignore=tests/test_demo_pack.py -k "not (eml or edr_cache)"

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-typecheck
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  scripts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          set -e
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All scripts pass bash -n"
      - name: Shellcheck (advisory)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh 2>&1 || echo "WARNING: shellcheck found issues (advisory only)"
          else
            echo "shellcheck not installed; skipping"
          fi
        continue-on-error: true

  setup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup --help
        run: |
          set -e
          bash scripts/setup.sh --help 2>&1 | grep -q "Usage" || { echo "FAIL: --help"; exit 1; }
          echo "PASS: --help works"
      - name: Check ASCII double-dash flags
        run: |
          set -e
          grep -q -- '--non-interactive' scripts/setup.sh || { echo "MISSING: --non-interactive flag"; exit 1; }
          grep -q -- '--upgrade' scripts/setup.sh || { echo "MISSING: --upgrade flag"; exit 1; }
          grep -q -- '--validate-only' scripts/setup.sh || { echo "MISSING: --validate-only flag"; exit 1; }
          echo "All required flags present"
      - name: Check no docker compose down -v
        run: |
          if grep -q 'docker compose down -v' scripts/setup.sh scripts/upgrade.sh; then
            echo "ERROR: docker compose down -v found in setup/upgrade scripts"
            exit 1
          fi
          echo "OK: no destructive down -v in scripts"
      - name: Check no plaintext secrets
        run: |
          if grep -En 'echo.*SECRET[^_]|echo.*PASSWORD[^_]' scripts/setup.sh 2>/dev/null | grep -v 'sed ' | grep -v '#' | grep -q .; then
            echo "ERROR: secrets may be exposed in output"
            exit 1
          fi
          echo "OK: secrets masked in output"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env for config check
        run: |
          cat > .env << 'EOF'
          KAIRON_DEPLOYMENT_MODE=localhost
          KAIRON_PUBLIC_URL=http://localhost:5173
          KAIRON_AUTH_ENABLED=true
          KAIRON_SESSION_SECRET=ci-placeholder-not-a-real-secret
          KAIRON_CSRF_SECRET=ci-placeholder-not-a-real-secret
          POSTGRES_PASSWORD=ci-placeholder-not-a-real-secret
          OPENSEARCH_INITIAL_ADMIN_PASSWORD=ci-placeholder-not-a-real-secret
          KAIRON_BOOTSTRAP_ADMIN_USERNAME=
          KAIRON_BOOTSTRAP_ADMIN_PASSWORD=
          KAIRON_ENABLE_MEMORY=false
          KAIRON_ENABLE_DASHBOARDS=false
          EOF
      - name: Docker Compose config
        run: |
          set -e
          docker compose config 2>&1 | head -5
          echo "Docker Compose config valid"
