name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag format check
        run: |
          TAG="${{ github.ref_name }}"
          echo "Release tag: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "WARNING: tag does not match semver pattern vX.Y.Z"
          fi

      - name: Check required files
        run: |
          test -f README.md || exit 1
          test -f docker-compose.yml || exit 1
          test -f scripts/setup.sh || exit 1
          echo "All required files present"

  backend:
    needs: validate-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      KAIRON_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Known pre-existing failures are marked xfail via
      # tests/conftest.py + tests/known_failures.txt, so a tagged release
      # genuinely fails this job on any regression instead of being
      # advisory. (--timeout=60 was previously passed here without the
      # pytest-timeout plugin installed, which made this job error out on
      # argument parsing before running a single test, entirely hidden by
      # continue-on-error; removed to match the working ci.yml invocation.)
      # runner.* is only available inside steps; setting these in the
      # job-level env made GitHub reject the whole workflow at validation time.
      - env:
          BACKEND_DATA_DIR: ${{ runner.temp }}/kairon-ci-data
          BACKEND_TEMP_DIR: ${{ runner.temp }}/kairon-ci-data/tmp
        run: python -m pytest tests/ -q --ignore=tests/test_demo_pack.py -k "not (eml or edr_cache)"

  frontend:
    needs: validate-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  scripts:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: Setup smoke
        run: bash scripts/setup.sh --help | grep -q "Usage" || exit 1

  compose:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate placeholder env
        run: |
          cat > .env << 'EOF'
          KAIRON_DEPLOYMENT_MODE=localhost
          KAIRON_PUBLIC_URL=http://localhost:5173
          KAIRON_AUTH_ENABLED=true
          KAIRON_SESSION_SECRET=release-ci-placeholder
          KAIRON_CSRF_SECRET=release-ci-placeholder
          POSTGRES_PASSWORD=release-ci-placeholder
          OPENSEARCH_INITIAL_ADMIN_PASSWORD=release-ci-placeholder
          KAIRON_ENABLE_MEMORY=false
          EOF
      - run: docker compose config -q || exit 1
